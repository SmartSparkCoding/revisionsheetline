  <body class="pin-locked">
    <div id="pinGate" class="pin-overlay" role="dialog" aria-modal="true" aria-labelledby="pinGateTitle">
      <form id="pinForm" class="pin-card">
        <h2 id="pinGateTitle">Enter PIN</h2>
        <p class="pin-help">Please enter the access PIN to continue.</p>
        <label for="pinInput">PIN</label>
        <input
          id="pinInput"
          name="pin"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          required
        />
        <button type="submit">Unlock</button>
        <p id="pinError" class="pin-error" aria-live="polite"></p>
      </form>
    </div>
    <div class="page-shell">
      <header class="hero">
        <p class="eyebrow">Download Hub</p>
        <h1>Revision Sheet Line</h1>
        <p class="subtitle">
          Choose a subject to view available revision sheets and download files.
        </p>
      </header>

      <main class="content">
        <section class="panel">
          <h2>Subjects</h2>
          <div id="subjectList" class="subject-list" aria-label="Subject choices"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2 id="sheetTitle">Revision Sheets</h2>
            <p id="sheetCount" class="sheet-count"></p>
          </div>
          <div id="sheetList" class="sheet-list" aria-live="polite"></div>
        </section>
      </main>
